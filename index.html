<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Точки КМЗ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14332a">
<style>
:root{
  --paper:#eceee9; --card:#fff; --ink:#14171a; --mute:#6b7280; --line:#dcded8;
  --ok:#16794a; --no:#5f6670; --red:#b3271e; --wait:#a86408; --warn:#8e1f14; --warnbg:#fbe4e0;
  --brand:#14332a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:84px;overscroll-behavior-y:contain}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 0}
.top{display:flex;align-items:baseline;gap:8px;padding-bottom:8px}
.top b{font-size:17px;font-weight:600;letter-spacing:.2px}
.top span{font-size:13px;color:#9fc0b2;margin-left:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:#20463a;color:#cfe3da;font:600 15px/1 system-ui;
  padding:11px 14px;border-radius:9px}
.tab[aria-selected=true]{background:#fff;color:var(--brand)}
.tab i{font-style:normal;font-weight:400;opacity:.75;margin-left:6px}
.bar{display:flex;gap:8px;padding:0 0 10px}
.bar input{flex:1;min-width:0;border:0;border-radius:9px;padding:12px 13px;
  font-size:16px;background:#20463a;color:#fff}
.bar input::placeholder{color:#8fb2a3}
.bar input:focus{outline:2px solid #fff;outline-offset:1px}
.stat{font-size:13px;color:#9fc0b2;padding-bottom:9px}
.prog{height:3px;background:#20463a;margin:0 -12px}
.prog i{display:block;height:100%;background:#5bd39b;width:0;transition:width .2s}
main{padding:10px 12px}
.hdr{margin:16px 0 8px;font-size:14px;font-weight:600;color:#4a5550;
  border-bottom:1.5px solid #cfd3cc;padding-bottom:6px}
.hdr:first-child{margin-top:2px}
.rowwrap{background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden;
  border-left:5px solid transparent}
.rowwrap.s-ok{border-left-color:var(--ok)}
.rowwrap.s-no{border-left-color:var(--red)}
.rowwrap.s-wait{border-left-color:var(--wait)}
.row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
  padding:15px 14px;text-align:left;font:inherit;color:inherit}
.row b{font-weight:600;font-size:17px;flex:1;display:block}
.row .cnt{font-size:13px;color:var(--mute);font-weight:400;display:block;margin-top:2px}
.quick{display:flex;gap:6px;padding:9px 10px 9px 0}
.quick button{width:52px;height:52px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;font-size:23px;line-height:1;color:#aeb3ac}
.quick button[aria-pressed=true]{border-color:transparent;color:#fff}
.quick .q-ok[aria-pressed=true]{background:var(--ok)}
.quick .q-no[aria-pressed=true]{background:var(--red)}
.rowline{display:flex;align-items:center}
.rowline .row{flex:1;padding-right:4px}
.link{background:#e9f0ec;color:#14332a;border-radius:9px;padding:11px 12px;margin:12px 0;font-size:15px}
.link b{font-weight:600}
.link button{border:0;background:none;color:#14332a;font:inherit;text-decoration:underline;
  padding:3px 0;margin-right:10px}
.more{width:100%;margin-top:14px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  padding:14px;font:600 16px/1 system-ui;color:var(--ink);text-align:left}
.more span{float:right;color:var(--mute);font-weight:400}
.body{padding:0 14px 14px;border-top:1px solid var(--line)}
.warn{background:var(--warnbg);color:var(--warn);font-size:15px;font-weight:500;
  padding:11px 12px;border-radius:9px;margin:12px 0}
.fri{background:#fdf0dc;color:#7a4d05;font-size:15px;font-weight:600;
  padding:11px 12px;border-radius:9px;margin:12px 0}
.calls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.calls a{text-decoration:none;background:var(--brand);color:#fff;font-weight:600;
  padding:12px 16px;border-radius:9px;font-size:16px}
.calls a.m{background:#fff;color:var(--brand);border:1.5px solid var(--line);padding:11px 14px;font-size:15px}
.calls a.max{background:#1f6ff0;color:#fff;border:0}
.calls em{font-style:normal;color:var(--mute);padding:12px 0;font-size:15px}
.cat{margin-top:14px}
.cat h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--mute)}
.chip{display:inline-block;background:#f1f2ee;border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;margin:0 6px 6px 0;font-size:15px}
.chip u{text-decoration:none;color:var(--warn);font-size:13px;margin-left:5px}
.chip b{font-weight:700;color:#3d6b57;font-size:13px;margin-right:6px}
.cat h4 span{font-weight:400;color:#9aa29c}
.src{font-size:13px;color:var(--mute);margin:10px 0 0}
.chip s{text-decoration:none;color:var(--mute);font-size:13px}
.empty{color:var(--mute);font-size:15px;margin:14px 0}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--ink);
  border-radius:10px;padding:13px 4px;font:600 15px/1.25 system-ui}
.acts button[aria-pressed=true]{color:#fff;border-color:transparent}
.acts .b-ok[aria-pressed=true]{background:var(--ok)}
.acts .b-no[aria-pressed=true]{background:var(--no)}
.acts .b-wait[aria-pressed=true]{background:var(--wait)}
textarea{width:100%;margin-top:10px;border:1.5px solid var(--line);border-radius:10px;
  padding:11px;font:16px/1.35 system-ui;resize:vertical;min-height:46px;background:#fff}
footer{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px;
  padding-bottom:calc(env(safe-area-inset-bottom) + 10px);
  background:rgba(236,238,233,.95);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
footer button{border:0;border-radius:11px;font:600 16px/1 system-ui;padding:16px}
#rep{flex:1;background:var(--brand);color:#fff}
#clr{background:#dfe1dc;color:#3d4247;padding-left:18px;padding-right:18px}
.toast{position:fixed;left:12px;right:12px;bottom:86px;background:#14171a;color:#fff;
  padding:14px;border-radius:11px;font-size:15px;text-align:center;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
:focus-visible{outline:2px solid #14332a;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top"><b>Точки КМЗ</b><span id="today"></span></div>
  <div class="tabs" id="tabs"></div>
  <div class="bar"><input id="q" type="search" placeholder="Поиск по названию" autocomplete="off"></div>
  <div class="stat" id="stat"></div>
  <div class="prog"><i id="prog"></i></div>
</header>
<main id="list"></main>
<footer>
  <button id="rep">Собрать отчёт</button>
  <button id="clr">Новый день</button>
</footer>
<div class="toast" id="toast"></div>

 "", "note": "", "f": [["Крем с ТВОРОГОМ \"Фермерский\" мдж 35% ведро 4кг", 91], ["Крем со СМЕТАНОЙ \"Кубаночка\", мдж 20% 5кг вед.", 82]], "t": 11}]}]};
const $ = s => document.querySelector(s);
const KEY = 'kmz_misha_v1';
const ST = {ok:'принял', no:'не берёт'};
const ICON = {ok:'✅', no:'❌'};

function todayStr(){
  const d = new Date();
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}
let state = {date: todayStr(), marks:{}};
try{
  const raw = JSON.parse(localStorage.getItem(KEY)||'null');
  if(raw && raw.date === todayStr()) state = raw;
}catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };

let tab = DATA.routes[0].id, openName = null, openPos = null, query = '';

const ALL = DATA.routes.flatMap(r => r.cl.map(c => ({...c, rid:r.id, rn:r.name})));
const GROUPS = {};
for(const c of ALL){
  if(!c.p) continue;
  const k = c.p.includes('групп') ? 'группа' : (c.p.match(/\d/g)||[]).join('');
  if(k.length < 5 && k !== 'группа') continue;
  (GROUPS[k] = GROUPS[k] || []).push(c);
}
function siblings(c){
  if(!c.p) return [];
  const k = c.p.includes('групп') ? 'группа' : (c.p.match(/\d/g)||[]).join('');
  return (GROUPS[k]||[]).filter(x => x.n !== c.n);
}
$('#today').textContent = todayStr();

const TABS = [...DATA.routes, {id:'all', name:'Все точки', sub:'', cl: ALL.filter(c => c.rid !== 'etc')}];

function mark(name){ return state.marks[name] || {}; }
function clients(){
  if(query.trim()){
    const q = query.trim().toLowerCase();
    return DATA.routes.flatMap(r => r.cl.map(c => ({...c, r:r.name})))
      .filter(c => c.n.toLowerCase().includes(q));
  }
  const r = TABS.find(x => x.id === tab);
  if(r.id !== 'all') return r.cl.map(c => ({...c, r:r.name}));
  const out = [];
  for(const g of DATA.routes){
    if(g.id === 'etc') continue;
    out.push({hdr: g.name + (g.sub ? ' · ' + g.sub : '')});
    for(const c of g.cl) out.push({...c, r:g.name});
  }
  return out;
}
function cid(s){ return s.replace(/[^a-zа-я0-9]/gi,''); }
function esc(s){ return s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function multiple(v){
  const m = v.match(/\((\d)\s*кг\)/);
  return m ? 'кратно '+m[1]+' кг' : '';
}

function drawTabs(){
  $('#tabs').innerHTML = TABS.map(r =>
    `<button class="tab" role="tab" aria-selected="${r.id===tab}" data-t="${r.id}">${r.name}${r.sub?`<i>${r.sub}</i>`:''}</button>`
  ).join('');
}

function drawProgress(){
  const r = TABS.find(x => x.id === tab);
  const took = r.cl.filter(c => mark(c.n).s === 'ok').length;
  const done = r.cl.filter(c => mark(c.n).s).length;
  const left = r.cl.length - done;
  $('#prog').style.width = (r.cl.length ? done/r.cl.length*100 : 0)+'%';
  $('#stat').textContent = r.cl.length
    ? `обошёл ${Math.round(done/r.cl.length*100)}% · взяли ${took} · осталось ${left}`
    : '';
}

function card(c){
  const F = c.f || [];
  const shown = openPos === c.n;
  const band = (t, lo, hi) => {
    const g = F.filter(x => x[1] >= lo && x[1] < hi);
    if(!g.length) return '';
    return `<div class="cat"><h4>${t} <span>${g.length}</span></h4>` + g.map(x => {
      const mul = multiple(x[0]);
      return `<span class="chip"><b>${x[1]}%</b>${esc(x[0])}${mul?` <u>${mul}</u>`:''}</span>`;
    }).join('') + `</div>`;
  };
  const pos = !shown ? '' : (F.length
    ? band('Берёт почти всегда', 90, 1000) + band('Часто', 40, 90) + band('Иногда', 0, 40)
      + `<p class="src">По ${c.t} заявкам с мая по сентябрь${c.t < 6 ? ' — мало данных, проценты условные' : ''}.</p>`
    : `<p class="empty">Заявок в архиве нет. Спроси у Жени, что берёт эта точка.</p>`);
  const phones = c.p ? (c.p.includes('групп')
      ? `<em>Заявку принимают в группе</em>`
      : c.p.split('\n').filter(p => p.replace(/\D/g,'').length >= 10).map(p => {
          const d = p.replace(/\D/g,''), w = d.replace(/^8/,'7');
          return `<a href="tel:${d}">${esc(p)}</a>`
            + `<a class="m max" data-copy="${w}" href="https://max.ru/:share?text=${encodeURIComponent('Здравствуйте! По заявке на завтра')}">MAX</a>`
            + `<a class="m" href="whatsapp://send?phone=${w}">WhatsApp</a>`
            + `<a class="m" href="sms:${d}">SMS</a>`;
        }).join(''))
    : `<em>Телефона нет</em>`;
  const phonesBox = phones.trim() ? phones : `<em>Телефона нет</em>`;
  const sib = siblings(c);
  const sibBox = sib.length ? `<div class="link">
      <b>Один номер на ${sib.length+1} точки — спроси сразу по всем:</b><br>
      ${sib.map(s => `<button data-go="${esc(s.n)}">${mark(s.n).s?ICON[mark(s.n).s]:'◻'} ${esc(s.n)}</button>`).join('')}
    </div>` : '';
  return `<div class="body">
    ${c.fri ? `<p class="fri">Заявка только на пятницу</p>` : ''}
    ${c.note ? `<p class="warn">${esc(c.note)}</p>` : ''}
    ${sibBox}
    <div class="calls">${phonesBox}</div>
    <button class="more" data-pos="${esc(c.n)}">Что берёт<span>${F.length?F.length+' поз.':'нет данных'} ${shown?'▲':'▼'}</span></button>
    ${pos}
  </div>`;
}

function draw(){
  drawTabs(); drawProgress();
  const list = clients();
  $('#list').innerHTML = list.length ? list.map(c => {
    if(c.hdr) return `<div class="hdr">${esc(c.hdr)}</div>`;
    const m = mark(c.n);
    const sib = siblings(c).length;
    const sub = [query ? c.r : '', c.fri ? 'только пятница' : '', sib ? 'один номер с ещё '+sib : ''].filter(Boolean).join(' · ');
    return `<div class="rowwrap ${m.s?'s-'+m.s:''}" id="c-${cid(c.n)}">
      <div class="rowline">
        <button class="row" data-open="${esc(c.n)}">
          <b>${esc(c.n)}</b>${sub?`<span class="cnt">${esc(sub)}</span>`:''}
        </button>
        <div class="quick">
          <button class="q-ok" data-s="ok" data-n="${esc(c.n)}" aria-pressed="${m.s==='ok'}" aria-label="Взял">✓</button>
          <button class="q-no" data-s="no" data-n="${esc(c.n)}" aria-pressed="${m.s==='no'}" aria-label="Не взял">✕</button>
        </div>
      </div>
      ${openName===c.n ? card(c) : ''}
    </div>`;
  }).join('') : `<p class="empty">Ничего не нашлось. Попробуй часть названия — «кутк», «анап».</p>`;
}

function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('on'), 2200);
}

document.addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]');
  if(cp){
    const v = '+'+cp.dataset.copy;
    try{ navigator.clipboard.writeText(v); }catch(err){}
    toast('Номер '+v+' скопирован — если чата нет, найди по номеру');
  }
  const t = e.target.closest('.tab');
  if(t){ tab = t.dataset.t; openName = null; openPos = null; query=''; $('#q').value=''; draw(); scrollTo(0,0); return; }
  const o = e.target.closest('[data-open]');
  if(o){ openName = openName === o.dataset.open ? null : o.dataset.open; openPos = null; draw(); return; }
  const p = e.target.closest('[data-pos]');
  if(p){ openPos = openPos === p.dataset.pos ? null : p.dataset.pos; draw(); return; }
  const g = e.target.closest('[data-go]');
  if(g){
    const n = g.dataset.go, r = ALL.find(x => x.n === n);
    if(r){ tab = r.rid; query = ''; $('#q').value = ''; openName = n; openPos = null; draw();
      const el = document.getElementById('c-'+cid(n));
      if(el) el.scrollIntoView({block:'center'}); }
    return;
  }
  const b = e.target.closest('[data-s]');
  if(b){
    const n = b.dataset.n, cur = mark(n);
    const ns = cur.s === b.dataset.s ? null : b.dataset.s;
    if(ns) state.marks[n] = {s: ns}; else delete state.marks[n];
    save(); draw(); return;
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ query = e.target.value; openName = null; draw(); return; }
});

$('#rep').onclick = async () => {
  const lines = ['Отчёт Миши · '+state.date];
  let any = false;
  for(const r of DATA.routes){
    const marked = r.cl.filter(c => mark(c.n).s);
    if(!marked.length) continue;
    any = true;
    lines.push('', r.name);
    for(const k of ['ok','no']){
      const g = marked.filter(c => mark(c.n).s === k);
      if(g.length) lines.push(ICON[k]+' '+ST[k]+' ('+g.length+'): ' + g.map(c => c.n).join('; '));
    }
    const left = r.cl.filter(c => !mark(c.n).s);
    if(left.length) lines.push('без отметки ('+left.length+'): ' + left.map(c => c.n).join('; '));
  }
  if(!any){ toast('Пока нечего отправлять — отметь хотя бы одну точку'); return; }
  const txt = lines.join('\n');
  try{ await navigator.clipboard.writeText(txt); toast('Отчёт скопирован — вставь в MAX'); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); toast('Отчёт скопирован — вставь в MAX');
  }
};

$('#clr').onclick = () => {
  if(!confirm('Стереть все отметки и начать новый день?')) return;
  state = {date: todayStr(), marks:{}}; save(); openName = null; draw();
  toast('Отметки очищены');
};

draw();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
