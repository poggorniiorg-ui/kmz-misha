<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Точки КМЗ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14332a">
<style>
:root{
  --paper:#eceee9; --card:#fff; --ink:#14171a; --mute:#6b7280; --line:#dcded8;
  --ok:#16794a; --red:#b3271e; --brand:#14332a; --deep:#20463a;
  --warn:#8e1f14; --warnbg:#fbe4e0; --amb:#7a4d05; --ambbg:#fdf0dc; --pay:#2c4a6b; --paybg:#e6edf5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:84px;overscroll-behavior-y:contain}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 0}
.top{display:flex;align-items:baseline;gap:8px;padding-bottom:8px}
.top b{font-size:17px;font-weight:600}
.top span{font-size:13px;color:#9fc0b2;margin-left:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:var(--deep);color:#cfe3da;font:600 15px/1 system-ui;padding:11px 14px;border-radius:9px}
.tab[aria-selected=true]{background:#fff;color:var(--brand)}
.tab i{font-style:normal;font-weight:400;opacity:.75;margin-left:6px}
.bar{display:flex;gap:8px;padding:0 0 8px}
.bar input{flex:1;min-width:0;border:0;border-radius:9px;padding:12px 13px;font-size:16px;background:var(--deep);color:#fff}
.bar input::placeholder{color:#8fb2a3}
.bar input:focus{outline:2px solid #fff;outline-offset:1px}
.bar button{flex:0 0 auto;border:0;border-radius:9px;padding:0 13px;font:600 14px/1 system-ui;background:var(--deep);color:#cfe3da}
.bar button[aria-pressed=true]{background:#5bd39b;color:#0d2a1f}
.stat{font-size:13px;color:#9fc0b2;padding-bottom:9px}
.prog{height:3px;background:var(--deep);margin:0 -12px}
.prog i{display:block;height:100%;background:#5bd39b;width:0;transition:width .2s}
main{padding:10px 12px}
.hdr{display:flex;width:100%;align-items:center;gap:8px;margin:12px 0 8px;background:#e2e5e0;border:0;border-radius:10px;
  padding:14px 13px;font:600 15px/1 system-ui;color:#2d3b34;text-align:left}
.hdr:first-child{margin-top:0}
.hdr i{font-style:normal;font-weight:400;color:#77807a;margin-left:auto;font-size:14px}
.rowwrap{background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden;border-left:5px solid transparent}
.rowwrap.s-ok{border-left-color:var(--ok)}
.rowwrap.s-no{border-left-color:var(--red)}
.rowline{display:flex;align-items:center}
.row{flex:1;min-width:0;background:none;border:0;padding:13px 4px 13px 14px;text-align:left;font:inherit;color:inherit}
.row b{font-weight:600;font-size:17px;display:block}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tg{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;line-height:1.4}
.tg.fri{background:var(--ambbg);color:var(--amb)}
.tg.pay{background:var(--paybg);color:var(--pay)}
.tg.warn{background:var(--warnbg);color:var(--warn)}
.tg.sib{background:#e9f0ec;color:#2d5a47}
.tg.new{background:#14332a;color:#fff}
.tg.src{background:#f1f2ee;color:#77807a}
.quick{display:flex;gap:6px;padding:9px 10px 9px 0}
.quick button{width:52px;height:52px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:23px;line-height:1;color:#aeb3ac}
.quick button[aria-pressed=true]{border-color:transparent;color:#fff}
.quick .q-ok[aria-pressed=true]{background:var(--ok)}
.quick .q-no[aria-pressed=true]{background:var(--red)}
.body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.pl{font-size:15px;font-weight:500;padding:10px 12px;border-radius:9px;margin:10px 0 0}
.pl.fri{background:var(--ambbg);color:var(--amb);font-weight:600}
.pl.warn{background:var(--warnbg);color:var(--warn)}
.pl.pay{background:var(--paybg);color:var(--pay)}
.link{background:#e9f0ec;color:#14332a;border-radius:9px;padding:11px 12px;margin:10px 0 0;font-size:15px}
.link b{font-weight:600;display:block;margin-bottom:4px}
.link .gl{display:flex;flex-wrap:wrap;gap:2px 12px}
.link .gl button{border:0;background:none;color:#14332a;font:inherit;text-decoration:underline;padding:4px 0;text-align:left}
.link .ga{display:flex;gap:8px;margin-top:8px}
.link .ga button{flex:1;border:0;border-radius:8px;padding:11px;font:600 15px/1 system-ui;color:#fff}
.ga .all-ok{background:var(--ok)} .ga .all-no{background:var(--red)}
.ph{margin-top:12px}
.ph small{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
.ph div{display:flex;flex-wrap:wrap;gap:6px}
.ph a{text-decoration:none;border-radius:9px;font-weight:600;font-size:15px;padding:11px 13px}
.ph a.call{background:var(--brand);color:#fff;font-size:16px}
.ph a.m{background:#fff;color:var(--brand);border:1.5px solid var(--line);padding:10px 12px}
.ph a.max{background:#1f6ff0;color:#fff;border-color:#1f6ff0}
.none{color:var(--mute);font-size:15px;margin:12px 0 0}
.more{width:100%;margin-top:14px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:14px;
  font:600 16px/1 system-ui;color:var(--ink);text-align:left}
.more span{float:right;color:var(--mute);font-weight:400}
.cat{display:flex;gap:8px;align-items:baseline;margin-top:9px}
.cat h4{margin:0;flex:0 0 82px;font-size:11px;font-weight:700;color:#98a09a;text-transform:uppercase;letter-spacing:.4px;line-height:1.5}
.cat div{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-block;background:#eaefec;color:#2d3b34;border-radius:7px;padding:5px 9px;font-size:14px;line-height:1.25}
.chip.core{background:var(--brand);color:#fff;font-weight:500}
.src{font-size:12px;color:#98a09a;margin:12px 0 0;line-height:1.5}
.empty{color:var(--mute);font-size:15px;margin:14px 0}
.paysec{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px}
.paysec h3{margin:0 0 4px;font-size:16px}
.paysec p{margin:0 0 10px;color:var(--mute);font-size:14px}
.paysec button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;border-top:1px solid var(--line);
  background:none;padding:12px 0;font:500 16px/1.3 system-ui;color:var(--ink);text-align:left}
.paysec button span{color:var(--mute);font-size:13px;font-weight:400;text-align:right}
footer{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(env(safe-area-inset-bottom) + 10px);
  background:rgba(236,238,233,.95);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
footer button{border:0;border-radius:11px;font:600 16px/1 system-ui;padding:16px}
#rep{flex:1;background:var(--brand);color:#fff}
#clr{background:#dfe1dc;color:#3d4247;padding-left:18px;padding-right:18px}
.toast{position:fixed;left:12px;right:12px;bottom:86px;background:#14171a;color:#fff;padding:14px;border-radius:11px;font-size:15px;
  text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
:focus-visible{outline:2px solid #14332a;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>

  <div class="prog"><i id="prog"></i></div>
</header>
<main id="list"></main>
<footer>
  <button id="rep">Собрать отчёт</button>

</footer>

const $ = s => document.querySelector(s);
const KEY = 'kmz_misha_v1';

const ICON = {ok:'✅', no:'❌'};
const MSG = 'Здравствуйте! По заявке на завтра';

function todayStr(){
  const d = new Date();
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}
let state = {date: todayStr(), marks:{}};
try{ const raw = JSON.parse(localStorage.getItem(KEY)||'null'); if(raw && raw.date === todayStr()) state = raw; }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };

let tab = DATA.routes[0].id, openName = null, openPos = null, query = '', hideDone = false;
const openRoutes = new Set();
$('#today').textContent = todayStr();

const ALL = DATA.routes.flatMap(r => r.cl.map(c => ({...c, rid:r.id, rn:r.name})));
const phoneKey = c => !c.p ? '' : c.p.includes('групп') ? 'группа' : (c.p.split('\n')[0].match(/\d/g)||[]).join('').slice(-10);
const GROUPS = {};
for(const c of ALL){ const k = phoneKey(c); if(k.length >= 10 || k === 'группа') (GROUPS[k] = GROUPS[k] || []).push(c); }
const siblings = c => { const k = phoneKey(c); return k ? (GROUPS[k]||[]).filter(x => x.n !== c.n) : []; };

const TABS = [...DATA.routes,
  {id:'all', name:'Все точки', sub:'', cl: ALL},
  {id:'pay', name:'Оплаты', sub:'', cl: []}];

const mark = n => state.marks[n] || {};
const cid = s => s.replace(/[^a-zа-яё0-9]/gi,'');
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function clients(){
  if(query.trim()){
    const q = query.trim().toLowerCase();
    return ALL.filter(c => c.n.toLowerCase().includes(q)).map(c => ({...c, r:c.rn}));
  }
  const r = TABS.find(x => x.id === tab);
  if(r.id !== 'all') return r.cl.map(c => ({...c, r:r.name}));
  const out = [];
  for(const g of DATA.routes){
    if(g.id === 'etc') continue;
    const on = openRoutes.has(g.id);
    const done = g.cl.filter(c => mark(c.n).s).length;
    out.push({hdr: g.name + (g.sub ? ' · ' + g.sub : ''), rid: g.id, on, info: `${done} из ${g.cl.length}`});
    if(on) for(const c of g.cl) out.push({...c, r:g.name});
  }
  return out;
}

function drawTabs(){
  $('#tabs').innerHTML = TABS.map(r =>
    `<button class="tab" role="tab" aria-selected="${r.id===tab && !query}" data-t="${r.id}">${r.name}${r.sub?`<i>${r.sub}</i>`:''}</button>`).join('');
}
function drawProgress(){
  const r = TABS.find(x => x.id === tab);
  if(r.id === 'pay'){ $('#stat').textContent = 'Напоминания по оплатам и актам сверки'; $('#prog').style.width = '0'; return; }
  const took = r.cl.filter(c => mark(c.n).s === 'ok').length;
  const done = r.cl.filter(c => mark(c.n).s).length;
  $('#prog').style.width = (r.cl.length ? done/r.cl.length*100 : 0)+'%';
  $('#stat').textContent = r.cl.length ? `обошёл ${Math.round(done/r.cl.length*100)}% · взяли ${took} · осталось ${r.cl.length-done}` : '';
}

function tags(c){
  const t = [];
  if(c.new) t.push('<span class="tg new">новый</span>');
  if(c.fri) t.push('<span class="tg fri">пятница</span>');
  const s = siblings(c).length;
  if(s) t.push(`<span class="tg sib">1 номер ×${s+1}</span>`);
  if(query) t.push(`<span class="tg src">${esc(c.r)}</span>`);
  return t.length ? `<span class="tags">${t.join('')}</span>` : '';
}

function card(c){
  const F = c.f || [];
  const shown = openPos === c.n;
  const cats = [];
  for(const [cat, lbl, core] of F){
    let g = cats.find(x => x[0] === cat);
    if(!g){ g = [cat, []]; cats.push(g); }
    g[1].push(`<span class="chip${core?' core':''}">${esc(lbl)}</span>`);
  }
  const pos = !shown ? '' : (F.length
    ? cats.map(([cat, ch]) => `<div class="cat"><h4>${esc(cat)}</h4><div>${ch.join('')}</div></div>`).join('')
      + (c.t ? `<p class="src">Тёмным — берёт почти всегда, светлым — иногда. По ${c.t} заявкам с мая${c.t < 6 ? ', данных мало' : ''}.</p>`
             : `<p class="src">Заявок в архиве нет — список из базы, без частоты.</p>`)
    : `<p class="empty">${c.new ? 'Новый клиент — заявок ещё не было.' : 'Заявок в архиве нет.'} Спроси у Жени, что берёт.</p>`);

  let phones = '';
  if(c.p && c.p.includes('групп')) phones = `<p class="none">Заявку принимают в группе</p>`;
  else if(c.p){
    phones = c.p.split('\n').map((p, i) => {
      const d = p.replace(/\D/g,'');
      if(d.length < 10) return '';
      const w = d.replace(/^8/,'7');
      const who = (c.w||[])[i];
      return `<div class="ph">${who?`<small>${esc(who)}</small>`:''}<div>
        <a class="call" href="tel:${d}">${esc(p)}</a>
        <a class="m max" data-copy="${w}" href="https://max.ru/:share?text=${encodeURIComponent(MSG)}">MAX</a>
        <a class="m" href="whatsapp://send?phone=${w}">WhatsApp</a>
        <a class="m" href="sms:${d}">SMS</a></div></div>`;
    }).join('');
  }
  if(!phones) phones = `<p class="none">Телефона нет</p>`;

  const sib = siblings(c);
  const sibBox = sib.length ? `<div class="link">
      <b>Один номер на ${sib.length+1} ${sib.length+1<5?'точки':'точек'} — спроси сразу по всем</b>
      <div class="gl">${sib.map(s => `<button data-go="${esc(s.n)}">${mark(s.n).s?ICON[mark(s.n).s]:'◻'} ${esc(s.n)}</button>`).join('')}</div>
    </div>` : '';

  return `<div class="body">
    ${c.fri ? `<p class="pl fri">Заявка только на пятницу</p>` : ''}
    ${c.note ? `<p class="pl warn">${esc(c.note)}</p>` : ''}
    ${sibBox}
    ${phones}
    <button class="more" data-pos="${esc(c.n)}">Что берёт<span>${F.length?F.length+' поз.':'нет данных'} ${shown?'▲':'▼'}</span></button>
    ${pos}
  </div>`;
}

function row(c){
  const m = mark(c.n);
  return `<div class="rowwrap ${m.s?'s-'+m.s:''}" id="c-${cid(c.n)}">
    <div class="rowline">
      <button class="row" data-open="${esc(c.n)}"><b>${esc(c.n)}</b>${tags(c)}</button>
      <div class="quick">
        <button class="q-ok" data-s="ok" data-n="${esc(c.n)}" aria-pressed="${m.s==='ok'}" aria-label="Взял">✓</button>
        <button class="q-no" data-s="no" data-n="${esc(c.n)}" aria-pressed="${m.s==='no'}" aria-label="Не взял">✕</button>
      </div>
    </div>
    ${openName===c.n ? card(c) : ''}
  </div>`;
}

function payView(){
  const sun = ALL.filter(c => c.pay && !c.pay.startsWith('Акт'));
  const act = ALL.filter(c => c.pay && c.pay.startsWith('Акт'));
  const grp = [];
  for(const c of sun){
    const k = c.n.split(' ')[0];
    let g = grp.find(x => x.k === k);
    if(!g){ g = {k, first:c.n, pay:c.pay, n:0, one:c.n}; grp.push(g); }
    g.n++;
  }
  grp.sort((a,b) => a.k.localeCompare(b.k,'ru'));
  const btn = g => `<button data-go="${esc(g.first)}">${esc(g.n>1 ? g.k : g.one)}<span>${esc(g.pay.replace('Вс — ',''))}${g.n>1?`, ${g.n} ${g.n<5?'точки':'точек'}`:''}</span></button>`;
  return `<div class="paysec"><h3>Воскресенье</h3><p>Скинуть на оплату или дождаться платёжки</p>${grp.map(btn).join('')}</div>
    <div class="paysec"><h3>Каждый месяц</h3><p>Акт сверки в ЭДО</p>
      <button data-go="Курпитко Карасунская">Курпитко Е.Н.<span>все точки, ${act.filter(c=>c.n.startsWith('Курпитко')).length}</span></button>
      ${act.filter(c => !c.n.startsWith('Курпитко')).map(c => `<button data-go="${esc(c.n)}">${esc(c.n)}<span>3 юрлица</span></button>`).join('')}
    </div>`;
}

function draw(){
  drawTabs(); drawProgress();
  if(tab === 'pay' && !query){ $('#list').innerHTML = payView(); return; }
  let list = clients();
  if(hideDone) list = list.filter(c => c.hdr || !mark(c.n).s || c.n === openName);
  $('#list').innerHTML = list.length ? list.map(c => c.hdr
      ? `<button class="hdr" data-fold="${c.rid}">${c.on?'▾':'▸'} ${esc(c.hdr)}<i>${c.info}</i></button>`
      : row(c)).join('')
    : `<p class="empty">${hideDone ? 'Все точки отмечены 👍' : 'Ничего не нашлось. Попробуй часть названия — «кутк», «анап».'}</p>`;
}

function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('on'), 2200); }
function setMark(n, s){ if(s) state.marks[n] = {s}; else delete state.marks[n]; }
function goTo(n){
  const r = ALL.find(x => x.n === n); if(!r) return;
  tab = r.rid; query = ''; $('#q').value = ''; openName = n; openPos = null; draw();
  const el = document.getElementById('c-'+cid(n)); if(el) el.scrollIntoView({block:'center'});
}

document.addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]');
  if(cp){ const v = '+'+cp.dataset.copy; try{ navigator.clipboard.writeText(v); }catch(err){} toast('Номер '+v+' скопирован — если чата нет, найди по номеру'); }
  const t = e.target.closest('.tab');

  if(fd){ const id = fd.dataset.fold; openRoutes.has(id) ? openRoutes.delete(id) : openRoutes.add(id); draw(); return; }
  const o = e.target.closest('[data-open]');
  if(o){ openName = openName === o.dataset.open ? null : o.dataset.open; openPos = null; draw(); return; }
  const p = e.target.closest('[data-pos]');
  if(p){ openPos = openPos === p.dataset.pos ? null : p.dataset.pos; draw(); return; }
  const g = e.target.closest('[data-go]');
  if(g){ goTo(g.dataset.go); return; }
  const b = e.target.closest('[data-s]');
  if(b){ const n = b.dataset.n; setMark(n, mark(n).s === b.dataset.s ? null : b.dataset.s); save(); draw(); return; }
});
document.addEventListener('input', e => { if(e.target.id === 'q'){ query = e.target.value; openName = null; draw(); } });
$('#hide').onclick = () => { hideDone = !hideDone; $('#hide').setAttribute('aria-pressed', hideDone); draw(); };

$('#rep').onclick = async () => {
  const lines = ['Отчёт · '+state.date]; let any = false;
  for(const r of DATA.routes){
    const marked = r.cl.filter(c => mark(c.n).s);
    if(!marked.length) continue; any = true;
    lines.push('', r.name);
    for(const k of ['ok','no']){
      const g = marked.filter(c => mark(c.n).s === k);
      if(g.length) lines.push(ICON[k]+' '+ST[k]+' ('+g.length+'): ' + g.map(c => c.n).join('; '));
    }
    const left = r.cl.filter(c => !mark(c.n).s);
    if(left.length) lines.push('без отметки ('+left.length+'): ' + left.map(c => c.n).join('; '));
  }
  if(!any){ toast('Пока нечего отправлять — отметь хотя бы одну точку'); return; }
  const txt = lines.join('\n');
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Отчёт скопирован — вставь в MAX');
};
$('#clr').onclick = () => {
  if(!confirm('Стереть все отметки и начать новый день?')) return;
  state = {date: todayStr(), marks:{}}; save(); openName = null; draw(); toast('Отметки очищены');
};

draw();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
